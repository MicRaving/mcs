# Studio server: ONE service, ONE image (Server/Dockerfile).  The sync server
# always runs; browser mode is the STUDIO_BROWSER_MODE switch on the same
# container.  Run from Server/ (the build context is the repo root, one level up).
#
#   docker compose up -d --build                        # browser mode ON (default here)
#   STUDIO_BROWSER_MODE=0 docker compose up -d --build  # sync only (~52 MB, 1 core)
#   docker compose --profile caddy up -d                # plus the bundled Caddy
#
# One origin serves both (deploy/caddy-browser-mode.txt): /app/... goes to the
# browser port (8780), everything else - /api/... - to 8770, unchanged for
# desktop clients.  Both ports belong to the same container, so the browser
# side can never starve the sync server: it is capped by this container's
# memory limit, and the supervisor derives its worker cap and pressure ceiling
# from it (STUDIO_WEB_MAX_WORKERS / STUDIO_WEB_PRESSURE_MB override).
name: studio

services:
  studio:
    build:
      context: ../
      dockerfile: Server/Dockerfile
    image: studio-server:local
    restart: unless-stopped
    environment:
      STUDIO_DATA_DIR: /data
      # the server trusts X-Forwarded-For only because a proxy sits in front of it
      STUDIO_TRUST_PROXY: "1"
      # ── the one switch ─────────────────────────────────────────────────
      # 1: the gateway + per-user workers on /app/ (8780); 0: sync server only
      STUDIO_BROWSER_MODE: ${STUDIO_BROWSER_MODE:-1}
      STUDIO_BROWSER_PORT: "8780"
      # ── browser mode (ignored while the switch is 0) ───────────────────
      STUDIO_WEB_DATA: /srv/studio/web          # mirrors + per-user homes
      STUDIO_WEB_SERVER: http://127.0.0.1:8770  # this container, never the public name
      STUDIO_WEB_LOCAL_BLOBS: /data/blobs       # link instead of download
      STUDIO_WEB_PUBLIC_ORIGIN: ${STUDIO_WEB_PUBLIC_ORIGIN:-https://meta.home.mfendt.de}
      STUDIO_WEB_COOKIE_SECURE: ${STUDIO_WEB_COOKIE_SECURE:-1}
      STUDIO_WEB_SESSION_DAYS: ${STUDIO_WEB_SESSION_DAYS:-30}
      STUDIO_WEB_LAUNCHER: ${STUDIO_WEB_LAUNCHER:-forkserver}
      # empty = derive from the cgroup memory limit; these are the overrides
      STUDIO_WEB_SOFT_MB: ${STUDIO_WEB_SOFT_MB:-}
      STUDIO_WEB_HARD_MB: ${STUDIO_WEB_HARD_MB:-}
      STUDIO_WEB_PRESSURE_MB: ${STUDIO_WEB_PRESSURE_MB:-}
      STUDIO_WEB_MAX_WORKERS: ${STUDIO_WEB_MAX_WORKERS:-}
      STUDIO_WEB_IDLE_SECS: ${STUDIO_WEB_IDLE_SECS:-}
      STUDIO_WEB_HEAVY_SLOTS: ${STUDIO_WEB_HEAVY_SLOTS:-1}
      MALLOC_ARENA_MAX: "2"
    volumes:
      - /srv/studio/data:/data              # SQLite DB, uploads metadata (rootfs)
      - /data/blobs:/data/blobs             # content-addressed blob store (extHDD mount point in the CT)
      - /srv/studio/web:/srv/studio/web     # mirrors, homes, caches (local-lvm, not the extHDD)
    ports:
      # LAN only: firewall 8770 and 8780 so that only the proxy host can reach them
      - "8770:8770"
      - "8780:8780"
    # browser mode's budget: gateway + forkserver + workers share this cgroup.
    # The supervisor recycles/reaps workers before the limit; memswap gives the
    # allocator high-water the CT's swap instead of an OOM.  Sync-only use stays
    # at ~52 MB whatever the cap says.
    mem_limit: ${STUDIO_MEM_LIMIT:-2g}
    memswap_limit: ${STUDIO_MEMSWAP_LIMIT:-2600m}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8770/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - studio
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.bundled:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
